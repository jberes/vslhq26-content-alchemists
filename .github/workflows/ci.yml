name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a secret in any commit fails the build
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  editor-interop:
    name: Editor bundle (esbuild + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build bundle
        run: npm run build
      - name: Round-trip suite (the G2 gate from Phase F4 on)
        run: npm test

  build-test:
    name: Build & test (server + shared UI)
    runs-on: ubuntu-latest # Docker is available for Testcontainers SQL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore
        # The MAUI shell is excluded here: its targets cannot build on Linux. The
        # desktop-shell job below covers it.
        run: dotnet restore Castmill.NoDesktop.slnf
      - name: Build (warnings are errors; NuGet audit is enforced)
        run: dotnet build Castmill.NoDesktop.slnf --no-restore --configuration Release
      - name: Test
        env:
          # Test-only key generated per run; never a real secret.
          Jwt__SigningKey: ci-only-${{ github.run_id }}-0123456789abcdef0123456789abcdef
        run: dotnet test Castmill.NoDesktop.slnf --no-build --configuration Release --logger "console;verbosity=normal"

  desktop-shell:
    name: Desktop shell (MAUI, Mac Catalyst)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pin the SDK band and workload set the desktop ships with
        # global.json rolls forward to the newest feature band, and on a runner that band's
        # MAUI workload brings a Mac Catalyst pack newer than any installed Xcode (the
        # trimmer then fails on UIKit types "introduced in MacCatalyst 27.0"). Pin this job
        # to exactly the ADR-018 SDK and its workload set — the pair the installers use.
        run: |
          dotnet new globaljson --sdk-version "$(jq -r .sdk.version global.json)" --roll-forward latestPatch --force
          dotnet --version
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "::notice::Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')— selected $(basename "$XCODE")"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install MAUI workload
        run: dotnet workload install maui --version "$(jq -r .sdk.version global.json)"
      - name: Build desktop shell
        # Proves the shared RCL still compiles into the native shell. Windows packaging
        # and the notarized macOS build arrive with Phase F9 (story 10.4).
        # Xamarin's native-tool errors carry no MSBuild error code, so the problem matcher
        # misses them; republish every error line as an annotation the run summary shows.
        run: |
          set -o pipefail
          dotnet build src/Castmill.Desktop/Castmill.Desktop.csproj --configuration Release -p:SkipEditorInterop=true 2>&1 | tee build.log || {
            grep -E "error" build.log | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }
