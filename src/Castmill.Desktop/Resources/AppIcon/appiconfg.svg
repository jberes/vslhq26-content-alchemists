<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Castmill mark: ONE SOURCE, MANY PIECES. A full-height bar on the left is the source
     master; three bars fan right at decreasing lengths as the pieces cut from it.

     This replaces a literal millstone (terracotta disc, eight spokes, square eye) that read
     as a wagon wheel or a ship's helm at icon size and said nothing about the product.

     Identical geometry to Layout/CastmillMark.razor, so the icon and the in-app lockup are
     one drawing rather than two things that drift. Content spans 108-348 of 456 (~53%),
     comfortably inside the ~66% safe area that Android adaptive icons and macOS masking
     crop to; the fan survives a circular mask untouched. Fully rounded caps (rx = half the
     bar height) read cleanly down to 16 px, where spokes turned to mush. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- The source master. -->
    <rect x="108" y="140" width="40" height="176" rx="20" fill="#F7F3EC" />

    <!-- The pieces. The longest carries the terracotta accent — the hero output. -->
    <rect x="176" y="140" width="172" height="40" rx="20" fill="#C0552E" />
    <rect x="176" y="208" width="120" height="40" rx="20" fill="#F7F3EC" fill-opacity="0.85" />
    <rect x="176" y="276" width="76" height="40" rx="20" fill="#F7F3EC" fill-opacity="0.6" />
</svg>
